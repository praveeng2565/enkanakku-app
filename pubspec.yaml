name: enkanakku_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.12.1 #Firebase core dependency
  firebase_auth: ^6.5.6 #Firebase core dependency
  # google_sign_in: ^7.2.0 #Firebase core dependency
  cloud_firestore: ^6.7.1 #Firebase core dependency
  firebase_crashlytics: ^5.2.6

  provider: ^6.1.5+1
  # shared_preferences: ^2.5.5
  shared_preferences: ^2.0.15
  dio: ^5.11.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  android_package_installer: ^0.0.3
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
